
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Appointments | CareFlow</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="dashboard-body">

    <div class="app-shell">

        <!-- Sidebar -->
        <aside class="sidebar">

            <a class="brand" href="index.html">
                ✚ Care<span>Flow</span>
            </a>

            <div class="side-label">PATIENT</div>

            <nav>
                <a href="user.html">▦ Dashboard</a>

                <a href="doctors.html">⌕ Find Doctors</a>

                <a href="book.html">＋ Book Appointment</a>

                <a class="active" href="appointments.html">
                    ◷ My Appointments
                </a>
            </nav>

            <div class="side-bottom">

                <a href="index.html">⌂ Home</a>

                <button onclick="logout()">↪ Logout</button>

            </div>

        </aside>

        <!-- Main Content -->
        <main class="dash-main">

            <!-- Header -->
            <header class="dash-header">

                <div>
                    <span class="eyebrow">APPOINTMENTS</span>

                    <h1>My appointments</h1>

                    <p>
                        Track and manage your healthcare visits.
                    </p>
                </div>

                <a href="book.html" class="btn btn-primary">
                    + New Appointment
                </a>

            </header>

            <!-- Appointment Filters -->
            <div class="tabs">

                <button
                    class="tab active"
                    onclick="filterAppointments('all', this)">
                    All
                </button>

                <button
                    class="tab"
                    onclick="filterAppointments('upcoming', this)">
                    Upcoming
                </button>

                <button
                    class="tab"
                    onclick="filterAppointments('completed', this)">
                    Completed
                </button>

                <button
                    class="tab"
                    onclick="filterAppointments('cancelled', this)">
                    Cancelled
                </button>

            </div>

            <!-- Appointment List -->
            <div
                id="appointmentList"
                class="appointment-list">
            </div>

        </main>

    </div>

    <script src="js/app.js"></script>

</body>

</html>
